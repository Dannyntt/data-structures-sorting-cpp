## 🔍 Análisis Comparativo

**¿Por qué QuickSort fue el más rápido?**
A pesar de tener un peor caso teórico de O(n²), QuickSort supera a los demás en la práctica gracias a su excelente **localidad de caché**: accede a la memoria de forma secuencial, lo que reduce los fallos de caché significativamente. Con la optimización de mediana de tres, el peor caso es prácticamente inexistente sobre datos aleatorios.

**¿Por qué HeapSort es más lento que QuickSort?**
HeapSort garantiza O(n log n) sin excepción, pero sus accesos al heap saltan por posiciones no contiguas en memoria (índice `i` accede a `2i+1` y `2i+2`), lo que genera muchos **fallos de caché** y degrada el rendimiento real.

**¿Por qué el Árbol AVL tiene mayor uso de memoria?**
Cada nodo del árbol requiere una asignación dinámica individual en el heap (`new AVLNode`), más los punteros `left`, `right` y el campo `height`. Esto suma aproximadamente **56 bytes por nodo**, frente al almacenamiento contiguo de los vectores. El overhead de ~1,900 KB adicionales frente a los métodos basados en vector refleja exactamente este costo.

**¿Qué algoritmo es más apropiado para este problema?**
Para un ordenamiento único de un dataset estático, **QuickSort** es la mejor opción. Si se necesitan garantías estrictas de tiempo (sin peor caso O(n²)), **HeapSort** es preferible. El **Árbol AVL** es más valioso cuando se requieren inserciones y búsquedas frecuentes sobre los datos ya ordenados, no solo un ordenamiento puntual.

