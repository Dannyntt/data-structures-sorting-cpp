> Implementación y análisis comparativo de tres estrategias de ordenamiento sobre un dataset de **100,000 palabras** en inglés, desarrollado en C++ desde cero.

---

## 🎯 Descripción

Este proyecto forma parte de la **Práctica I** del curso *ST0245 – Estructuras de Datos y Algoritmos* de la **Universidad EAFIT** (Medellín, Colombia).

El objetivo es comparar el rendimiento real de tres algoritmos de ordenamiento implementados sobre diferentes estructuras de datos, analizando tiempo de ejecución, uso de memoria y complejidad algorítmica.

---

## ⚙️ Algoritmos Implementados

### 1. 🔀 QuickSort — `std::vector<string>`
- Implementación **iterativa** con pila explícita (evita desbordamiento de pila en datasets grandes)
- Selección de pivote por **mediana de tres** para reducir el riesgo del peor caso
- Ordenamiento **in-place** sobre un arreglo dinámico

### 2. 🏔️ HeapSort — Binary Max-Heap
- Construcción del heap desde cero mediante **heapify**
- Extracción ordenada intercambiando raíz con el último elemento
- Garantiza O(n log n) en todos los casos

### 3. 🌳 Árbol AVL
- Inserción de las 100,000 palabras con **auto-balanceo** (rotaciones LL, RR, LR, RL)
- Recorrido **inorden iterativo** para obtener el listado ordenado
- Control de altura y factor de balance en cada nodo

